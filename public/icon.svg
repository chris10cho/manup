<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d544f"/><stop offset="0.5" stop-color="#2f3431"/><stop offset="1" stop-color="#1a1d1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#e8f0ea" stop-opacity="0.16"/><stop offset="1" stop-color="#e8f0ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a726c" stop-opacity="0.45"/><stop offset="1" stop-color="#6a726c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.22" stop-color="#e3e9e6"/><stop offset="0.6" stop-color="#9aa6a1"/><stop offset="1" stop-color="#5a6561"/>
    </linearGradient>
    <linearGradient id="plate2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6faf8"/><stop offset="0.3" stop-color="#cfd8d4"/><stop offset="0.7" stop-color="#8a9792"/><stop offset="1" stop-color="#4f5a56"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#d5dcd9"/><stop offset="0.7" stop-color="#8b9893"/><stop offset="1" stop-color="#58645f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fb0a6" stop-opacity="0.34"/><stop offset="0.6" stop-color="#9fb0a6" stop-opacity="0.12"/><stop offset="1" stop-color="#9fb0a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="side">
      <rect x="112" y="-103" width="40" height="206" rx="12" fill="url(#plate)" stroke="#4cc26b" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="116" y="-97" width="7" height="194" rx="3.5" fill="#fff" opacity="0.8"/>
      <rect x="146" y="-90" width="3" height="180" rx="1.5" fill="#fff" opacity="0.25"/>
      <rect x="154" y="-76" width="30" height="152" rx="10" fill="url(#plate2)" stroke="#4cc26b" stroke-opacity="0.35" stroke-width="1.2"/>
      <rect x="157" y="-70" width="6" height="140" rx="3" fill="#fff" opacity="0.75"/>
      <rect x="186" y="-30" width="14" height="60" rx="5" fill="url(#steel)"/>
    </g>
