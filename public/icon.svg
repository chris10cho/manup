<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7bf0a4"/>
      <stop offset="0.45" stop-color="#1fa851"/>
      <stop offset="1" stop-color="#074a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dfe9e2"/>
      <stop offset="1" stop-color="#9db3a5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa192"/>
      <stop offset="1" stop-color="#4f6a5b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c9d2cd"/>
      <stop offset="0.7" stop-color="#7d8c84"/>
      <stop offset="1" stop-color="#4a5852"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- ground shadow -->
  <ellipse cx="268" cy="378" rx="150" ry="16" fill="#031f10" opacity="0.5" filter="url(#soft)"/>
  <g transform="rotate(-16 256 256)">
    <!-- bar -->
    <rect x="92" y="246" width="328" height="20" rx="10" fill="url(#steel)"/>
    <!-- left plates (back edge for thickness, then face) -->
    <rect x="127" y="160" width="46" height="196" rx="14" fill="url(#edge)"/>
    <rect x="118" y="154" width="46" height="196" rx="14" fill="url(#plate)"/>
    <rect x="125" y="160" width="6" height="150" rx="3" fill="#fff" opacity="0.7"/>
    <rect x="180" y="178" width="38" height="156" rx="12" fill="url(#edge)"/>
    <rect x="172" y="172" width="38" height="156" rx="12" fill="url(#plate)"/>
    <rect x="178" y="178" width="5" height="116" rx="2.5" fill="#fff" opacity="0.7"/>
    <!-- right plates -->
    <rect x="302" y="178" width="38" height="156" rx="12" fill="url(#edge)"/>
    <rect x="294" y="172" width="38" height="156" rx="12" fill="url(#plate)"/>
    <rect x="300" y="178" width="5" height="116" rx="2.5" fill="#fff" opacity="0.7"/>
    <rect x="355" y="160" width="46" height="196" rx="14" fill="url(#edge)"/>
    <rect x="346" y="154" width="46" height="196" rx="14" fill="url(#plate)"/>
    <rect x="353" y="160" width="6" height="150" rx="3" fill="#fff" opacity="0.7"/>
    <!-- bar highlight on top of plates' gap -->
    <rect x="214" y="248" width="76" height="6" rx="3" fill="#fff" opacity="0.8"/>
  </g>
</svg>
