  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <ellipse cx="256" cy="414" rx="185" ry="38" fill="url(#sheen)"/>
  <ellipse cx="256" cy="424" rx="150" ry="11" fill="#07090a" opacity="0.5" filter="url(#blur)"/>
  <ellipse cx="138" cy="426" rx="50" ry="6.5" fill="#050707" opacity="0.9" filter="url(#blur2)"/>
  <ellipse cx="375" cy="424" rx="50" ry="6.5" fill="#050707" opacity="0.9" filter="url(#blur2)"/>
  <ellipse cx="138" cy="425" rx="30" ry="2.4" fill="#000" opacity="0.8" filter="url(#blur2)"/>
  <ellipse cx="375" cy="423" rx="30" ry="2.4" fill="#000" opacity="0.8" filter="url(#blur2)"/>
  <g transform="translate(256 330) rotate(-1) scale(0.9)">
    <rect x="-196" y="-12" width="392" height="24" rx="12" fill="url(#steel)"/>
    <rect x="-196" y="-7" width="392" height="4" rx="1.5" fill="#fff" opacity="0.95"/>
    <use href="#side"/>
    <use href="#side" transform="scale(-1 1)"/>
